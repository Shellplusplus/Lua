name: Package and release Lua payload

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Package Lua watch-face payload
        run: |
          zip -r shellpp-lua.zip . \
            -x '.git/*' '.github/*' '.DS_Store' '._*' '*/._*' '.SynologyWorkingDirectory'
      - name: Publish private repository Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: lua-build-${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" shellpp-lua.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Shell++ Lua build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated package from ${GITHUB_SHA}."
